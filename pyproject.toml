[project]
name = "pmo-portfolio-platform"
version = "0.1.0"
description = "End-to-end PMO analytics platform on fictional data: simulator, ingestion, dbt, orchestration, LLM extraction."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "faker>=30",
    "sqlalchemy>=2.0",
    "openpyxl>=3.1",
    "psycopg2-binary>=2.9",
    "dlt[duckdb,sql-database]>=1.4",
    "dbt-core>=1.10,<1.11",
    "dbt-duckdb>=1.9.4,<1.10",
    "dagster>=1.13.27",
    "dagster-dbt>=0.29.27",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# installed in editable mode by `uv sync`, so every module is importable from anywhere
packages = ["simulator", "ingestion", "extractor", "orchestration"]

[dependency-groups]
dev = [
    "dagster-webserver>=1.13.27",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "E501"]  # lambdas are fine; line length is left to `ruff format`

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:dlt.*", "ignore::DeprecationWarning:dagster_dbt.*", "ignore::DeprecationWarning:dbt.*", "ignore::DeprecationWarning:sqlglotrs.*"]

[tool.dagster]
module_name = "orchestration.definitions"
code_location_name = "pmo_portfolio_platform"
